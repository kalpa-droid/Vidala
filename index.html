<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Vidala para mi Barrio — Presentación interactiva sobre la Vidala y la cultura barrial de Salta, Argentina">
    <meta name="theme-color" content="#4a0e1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vidala">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>Vidala para mi Barrio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #0d0408;
            --bg-burgundy: #1a0a10;
            --accent-burgundy: #6b1530;
            --accent-rose: #b0002b;
            --accent-gold: #d4a855;
            --accent-cream: #fbe3bf;
            --text-primary: #f5e6d8;
            --text-secondary: #c9a48a;
            --glass-bg: rgba(26, 10, 16, 0.75);
            --glass-border: rgba(251, 227, 191, 0.15);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================
           WELCOME SCREEN
           ============================================ */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 30% 40%, #2a0f18 0%, #0d0408 60%, #050203 100%);
            transition: opacity 0.8s ease, visibility 0.8s ease;
            overflow: hidden;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Animated background particles */
        .bg-particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0%   { opacity: 0; transform: translateY(100vh) scale(0); }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        .welcome-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px;
            max-width: 600px;
            width: 92%;
        }

        .welcome-icon {
            font-size: 72px;
            margin-bottom: 20px;
            animation: pulse-glow 2.5s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(176, 0, 43, 0.5));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(176, 0, 43, 0.3)); }
            50%      { transform: scale(1.06); filter: drop-shadow(0 0 35px rgba(176, 0, 43, 0.7)); }
        }

        .welcome-title {
            font-size: clamp(28px, 6vw, 52px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cream) 0%, var(--accent-gold) 50%, var(--accent-cream) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .welcome-subtitle {
            font-size: clamp(13px, 2.5vw, 17px);
            font-weight: 300;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .welcome-subtitle strong {
            color: var(--accent-cream);
            font-weight: 600;
        }

        .enter-btn {
            background: linear-gradient(135deg, var(--accent-burgundy) 0%, var(--accent-rose) 50%, #d4213d 100%);
            color: #ffffff;
            border: none;
            padding: 16px 48px;
            font-size: clamp(16px, 3vw, 20px);
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            border-radius: 60px;
            cursor: pointer;
            box-shadow:
                0 8px 30px rgba(176, 0, 43, 0.4),
                0 2px 8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow:
                0 14px 40px rgba(176, 0, 43, 0.55),
                0 4px 12px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .enter-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .music-credit {
            margin-top: 20px;
            font-size: clamp(10px, 1.8vw, 13px);
            color: rgba(201, 164, 138, 0.6);
        }

        /* ============================================
           STAGE — wraps presentation + controls so they
           can be rotated together into forced landscape
           ============================================ */
        #stage {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Forced-landscape trick: rotate the whole stage 90deg and
           swap width/height so it visually fills the screen in
           landscape even though the phone is physically in portrait.
           No permission, dialog or native orientation API needed. */
        #stage.force-landscape {
            position: fixed;
            top: 0;
            left: 100%;
            width: 100vh;
            height: 100vw;
            transform-origin: 0 0;
            transform: rotate(90deg);
        }

        /* ============================================
           PRESENTATION CONTAINER
           ============================================ */
        #presentation-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
        }

        #presentation-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ============================================
           FLOATING CONTROLS (RIGHT SIDE)
           ============================================ */
        .controls-right {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .controls-right.visible {
            opacity: 1;
            visibility: visible;
        }

        /* ============================================
           FLOATING CONTROLS (LEFT SIDE)
           ============================================ */
        .controls-left {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .controls-left.visible {
            opacity: 1;
            visibility: visible;
        }

        /* ============================================
           FLOATING BUTTON STYLE
           ============================================ */
        .fab {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--accent-cream);
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
        }

        .fab:hover {
            transform: scale(1.12);
            background: rgba(107, 21, 48, 0.85);
            box-shadow: 0 6px 25px rgba(176, 0, 43, 0.4);
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            pointer-events: none;
        }

        /* Tooltip */
        .fab::after {
            content: attr(data-tooltip);
            position: absolute;
            white-space: nowrap;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
            background: rgba(0, 0, 0, 0.85);
            color: var(--accent-cream);
            padding: 5px 10px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .controls-right .fab::after {
            right: 56px;
            top: 50%;
            transform: translateY(-50%);
        }

        .controls-left .fab::after {
            left: 56px;
            top: 50%;
            transform: translateY(-50%);
        }

        .fab:hover::after {
            opacity: 1;
        }

        /* Install button special */
        #install-btn {
            display: none;
        }

        /* ============================================
           TOAST NOTIFICATION
           ============================================ */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(26, 10, 16, 0.92);
            border: 1px solid var(--glass-border);
            color: var(--accent-cream);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            backdrop-filter: blur(12px);
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 600px) {
            .fab {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .fab svg {
                width: 19px;
                height: 19px;
            }
            .controls-right { right: 8px; gap: 8px; }
            .controls-left { left: 8px; gap: 8px; }
        }

        @media (max-height: 400px) {
            .fab {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
            .fab svg {
                width: 17px;
                height: 17px;
            }
            .controls-right { gap: 6px; }
            .controls-left { gap: 6px; }
        }

        /* Portrait warning overlay removed — landscape is now forced via CSS transform (see #stage.force-landscape) */
    </style>
</head>
<body>
    <!-- ============================================
         AUDIO
         ============================================ -->
    <audio id="bg-music" loop preload="auto">
        <source src="audio/musica.mp3" type="audio/mpeg">
    </audio>

    <!-- ============================================
         WELCOME SCREEN
         ============================================ -->
    <div id="welcome-screen">
        <!-- Animated particles background -->
        <div class="bg-particles" id="particles-container"></div>

        <div class="welcome-content">
            <div class="welcome-icon">🎶</div>
            <h1 class="welcome-title">Vidala para mi Barrio</h1>
            <p class="welcome-subtitle">
                Una presentación interactiva sobre la Vidala<br>
                y la cultura barrial de <strong>Salta, Argentina</strong>
            </p>
            <button id="btn-enter" class="enter-btn" type="button">
                <span>▶</span> Ingresar
            </button>
            <p class="music-credit">🎵 Música: Comparsa de las Mujeres — Voces Hiladas</p>
        </div>
    </div>

    <!-- ============================================
         STAGE — presentation + controls, rotated together
         when the device needs forced landscape
         ============================================ -->
    <div id="stage">

    <!-- ============================================
         PRESENTATION (iframe)
         ============================================ -->
    <div id="presentation-container">
        <iframe id="sozi-frame" src="about:blank" allow="fullscreen" allowfullscreen></iframe>
    </div>

    <!-- ============================================
         FLOATING CONTROLS — RIGHT (Audio + Navigation)
         ============================================ -->
    <div class="controls-right" id="controls-right">
        <!-- Mute / Unmute -->
        <button class="fab" id="btn-mute" type="button" data-tooltip="Silenciar" aria-label="Silenciar música">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.47 4.47 0 0 0 2.5-3.5zM14 3.23v2.06a6.51 6.51 0 0 1 0 13.42v2.06A8.5 8.5 0 0 0 14 3.23z"/></svg>
        </button>

        <!-- Previous frame -->
        <button class="fab" id="btn-prev" type="button" data-tooltip="Anterior" aria-label="Diapositiva anterior">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <!-- Next frame -->
        <button class="fab" id="btn-next" type="button" data-tooltip="Siguiente" aria-label="Diapositiva siguiente">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <!-- ============================================
         FLOATING CONTROLS — LEFT (Screenshot + Install)
         ============================================ -->
    <div class="controls-left" id="controls-left">
        <!-- Screenshot -->
        <button class="fab" id="btn-screenshot" type="button" data-tooltip="Captura de pantalla" aria-label="Captura de pantalla">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </button>

        <!-- Install PWA -->
        <button class="fab" id="install-btn" type="button" data-tooltip="Instalar App" aria-label="Instalar aplicación">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
    </div>

    </div><!-- /#stage -->

    <!-- ============================================
         TOAST
         ============================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================
         SCRIPTS
         ============================================ -->
    <script>
    (function() {
        'use strict';

        // === DOM References ===
        var music         = document.getElementById('bg-music');
        var welcomeScreen = document.getElementById('welcome-screen');
        var btnEnter      = document.getElementById('btn-enter');
        var btnMute       = document.getElementById('btn-mute');
        var btnPrev       = document.getElementById('btn-prev');
        var btnNext       = document.getElementById('btn-next');
        var btnScreenshot  = document.getElementById('btn-screenshot');
        var installBtn    = document.getElementById('install-btn');
        var controlsRight = document.getElementById('controls-right');
        var controlsLeft  = document.getElementById('controls-left');
        var soziFrame     = document.getElementById('sozi-frame');
        var toast         = document.getElementById('toast');
        var stage         = document.getElementById('stage');

        var isMuted = false;
        var deferredPrompt = null;
        var presentationStarted = false;

        // === Generate background particles ===
        var particlesContainer = document.getElementById('particles-container');
        for (var i = 0; i < 30; i++) {
            var p = document.createElement('div');
            p.className = 'particle';
            var size = Math.random() * 4 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.background = Math.random() > 0.5
                ? 'rgba(176, 0, 43, ' + (Math.random() * 0.5 + 0.2) + ')'
                : 'rgba(212, 168, 85, ' + (Math.random() * 0.4 + 0.1) + ')';
            p.style.animationDuration = (Math.random() * 10 + 8) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            particlesContainer.appendChild(p);
        }

        // === Toast helper ===
        function showToast(msg, duration) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, duration || 2500);
        }

        // === Try to lock screen to landscape (native API, works on some
        // Android/Chrome setups). Purely a bonus — the CSS rotation below
        // is what actually guarantees landscape everywhere else. ===
        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function() {
                    // silently fail — not all browsers support this
                });
            }
        }

        // === Force-landscape via CSS rotation (game-style, no prompts) ===
        function updateStageOrientation() {
            if (!presentationStarted) return;
            var isPortrait = window.innerWidth < window.innerHeight;
            stage.classList.toggle('force-landscape', isPortrait);
        }
        window.addEventListener('resize', updateStageOrientation);
        window.addEventListener('orientationchange', updateStageOrientation);

        // === ENTER BUTTON ===
        btnEnter.addEventListener('click', function() {
            // Start music
            music.play().then(function() {
                isMuted = false;
            }).catch(function(err) {
                console.log('Audio play error:', err);
            });

            presentationStarted = true;

            // Try native lock first, then always apply the CSS rotation
            // fallback so it works instantly on every device, no dialog.
            lockLandscape();
            updateStageOrientation();

            // Load the Sozi presentation
            soziFrame.src = 'presentacion.html';

            // Hide welcome screen
            welcomeScreen.classList.add('hidden');
            setTimeout(function() {
                welcomeScreen.style.display = 'none';
            }, 900);

            // Show controls
            controlsRight.classList.add('visible');
            controlsLeft.classList.add('visible');

            // Try fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(function(){});
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        });

        // === MUTE / UNMUTE ===
        var svgVolOn  = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.47 4.47 0 0 0 2.5-3.5zM14 3.23v2.06a6.51 6.51 0 0 1 0 13.42v2.06A8.5 8.5 0 0 0 14 3.23z"/></svg>';
        var svgVolOff = '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8.5v2.09l2.41 2.41c.06-.31.09-.63.09-.99zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.46 8.46 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.47 8.47 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4l-1.88 1.88L12 7.76V4z"/></svg>';

        btnMute.addEventListener('click', function() {
            if (isMuted) {
                music.muted = false;
                isMuted = false;
                btnMute.innerHTML = svgVolOn;
                btnMute.setAttribute('data-tooltip', 'Silenciar');
                showToast('🎵 Música activada');
            } else {
                music.muted = true;
                isMuted = true;
                btnMute.innerHTML = svgVolOff;
                btnMute.setAttribute('data-tooltip', 'Activar sonido');
                showToast('🔇 Música silenciada');
            }
        });

        // === NAVIGATION (Sozi) ===
        function soziCommand(method) {
            try {
                var soziWin = soziFrame.contentWindow;
                if (soziWin && soziWin.sozi && soziWin.sozi.player) {
                    soziWin.sozi.player[method]();
                }
            } catch(e) {
                console.log('Sozi navigation error:', e);
            }
        }

        btnPrev.addEventListener('click', function() {
            soziCommand('moveToPrevious');
        });

        btnNext.addEventListener('click', function() {
            soziCommand('moveToNext');
        });

        // === SCREENSHOT ===
        btnScreenshot.addEventListener('click', function() {
            showToast('📸 Preparando captura...');
            try {
                // Use html2canvas-like approach via canvas capture
                var iframe = soziFrame;
                var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                var svg = iframeDoc.querySelector('svg');
                if (svg) {
                    // Clone the SVG and serialize
                    var svgData = new XMLSerializer().serializeToString(svg);
                    var canvas = document.createElement('canvas');
                    var rect = svg.getBoundingClientRect();
                    canvas.width = rect.width * 2;
                    canvas.height = rect.height * 2;
                    var ctx = canvas.getContext('2d');
                    ctx.scale(2, 2);
                    var img = new Image();
                    img.onload = function() {
                        ctx.fillStyle = '#0d0408';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, rect.width, rect.height);
                        canvas.toBlob(function(blob) {
                            var url = URL.createObjectURL(blob);
                            var a = document.createElement('a');
                            a.href = url;
                            a.download = 'vidala-captura-' + Date.now() + '.png';
                            a.click();
                            URL.revokeObjectURL(url);
                            showToast('✅ Captura descargada');
                        }, 'image/png');
                    };
                    img.onerror = function() {
                        showToast('⚠️ No se pudo capturar (contenido protegido)');
                    };
                    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
                } else {
                    showToast('⚠️ No se encontró contenido para capturar');
                }
            } catch(e) {
                console.log('Screenshot error:', e);
                showToast('⚠️ Captura no disponible en este navegador');
            }
        });

        // === PWA INSTALL ===
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function(result) {
                    if (result.outcome === 'accepted') {
                        showToast('✅ ¡Aplicación instalada!');
                    }
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                });
            } else {
                showToast('ℹ️ Abrí en Chrome y usá "Agregar a pantalla de inicio"');
            }
        });

        // === SERVICE WORKER — registro + auto-actualización ===
        if ('serviceWorker' in navigator) {
            var swRefreshing = false;

            // Cuando el nuevo Service Worker toma el control (porque
            // detectó una versión distinta), la página activa ya quedó
            // vieja: la recargamos una sola vez para traer todo fresco.
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (swRefreshing) return;
                swRefreshing = true;
                showToast('🔄 Nueva versión disponible, actualizando...', 1500);
                setTimeout(function() {
                    window.location.reload();
                }, 900);
            });

            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(reg) {
                    console.log('SW registrado:', reg.scope);

                    // Revisar de inmediato si hay una versión más nueva
                    // de sw.js (esto es lo que dispara todo el proceso
                    // de actualización si cambiamos CACHE_NAME).
                    reg.update();

                    // Volver a revisar cada vez que la app pasa a
                    // primer plano (ej: la abrís desde el ícono luego
                    // de tenerla en segundo plano un rato).
                    document.addEventListener('visibilitychange', function() {
                        if (document.visibilityState === 'visible') {
                            reg.update();
                        }
                    });

                    // Y una revisión periódica mientras esté abierta,
                    // por si queda mucho tiempo en primer plano.
                    setInterval(function() {
                        reg.update();
                    }, 60 * 60 * 1000); // cada 1 hora
                }).catch(function(err) {
                    console.log('Error SW:', err);
                });
            });
        }

        // === KEYBOARD NAV (for desktop) ===
        document.addEventListener('keydown', function(e) {
            if (welcomeScreen.style.display !== 'none') return;
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                soziCommand('moveToNext');
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                soziCommand('moveToPrevious');
            } else if (e.key === 'm' || e.key === 'M') {
                btnMute.click();
            }
        });

    })();
    </script>
</body>
</html>
